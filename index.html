<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Workout</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12695B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Personal Workout">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Hind:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --surface2:#E2E9E4; --ink:#13261F; --muted:#56675F; --line:#D3DCD6;
  --pull:#12695B; --on-pull:#FFFFFF;
  --push:#6A3D9A; --on-push:#FFFFFF;
  --legs:#E0A00F; --on-legs:#221803;
  --box:#C2302A; --on-box:#FFFFFF;
  --flex:#2F6A9E; --on-flex:#FFFFFF;
  --gold:#E0A00F; --on-gold:#221803;
  --focus:#1F5FBF; --amber-text:#8A5A00;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1714; --surface:#16231F; --surface2:#20302A; --ink:#E4EDE8; --muted:#97A8A0; --line:#2A3B33;
    --pull:#2E9E89; --on-pull:#04140F; --push:#9C79CC; --on-push:#160A24;
    --legs:#F0B53A; --on-legs:#221803; --box:#D9473F; --on-box:#FFFFFF; --flex:#6FA6D6; --on-flex:#0A1724;
    --gold:#F0B53A; --on-gold:#221803; --focus:#7FB0FF; --amber-text:#F0B53A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#16231F; --surface2:#20302A; --ink:#E4EDE8; --muted:#97A8A0; --line:#2A3B33;
  --pull:#2E9E89; --on-pull:#04140F; --push:#9C79CC; --on-push:#160A24;
  --legs:#F0B53A; --on-legs:#221803; --box:#D9473F; --on-box:#FFFFFF; --flex:#6FA6D6; --on-flex:#0A1724;
  --gold:#F0B53A; --on-gold:#221803; --focus:#7FB0FF; --amber-text:#F0B53A;
  color-scheme:dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Hind","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:17px; line-height:1.5; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:disabled{ opacity:.35; cursor:default; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.cond{ font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.app{ max-width:520px; margin:0 auto; padding:12px 16px 104px; }
.top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:6px 2px 14px; }
.top h1{ font-size:21px; margin:0; font-weight:600; }
.date{ color:var(--muted); font-size:15px; }
h3{ margin:0 0 6px; font-size:18px; font-weight:600; }
p{ margin:0 0 8px; }
.small{ font-size:15px; color:var(--muted); }
.card{ background:var(--surface); border-radius:16px; padding:16px; margin-top:14px; }
.card-h{ display:flex; justify-content:space-between; align-items:baseline; }
.count{ font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:30px; line-height:1; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }

/* figure */
.fig{ display:block; width:100%; max-width:280px; height:auto; margin:4px auto; color:var(--fig, var(--c)); overflow:visible; }
.fig .prop{ fill:currentColor; opacity:.26; }
.fig .floor{ stroke:currentColor; opacity:.22; }
.fig .bagp{ fill:var(--gold); }

/* hero */
.hero{ background:var(--c); color:var(--onc); border-radius:22px; padding:20px; }
.hero.rest{ --c:var(--surface); --onc:var(--ink); }
.hero .lead{ font-size:16px; opacity:.88; margin:0; }
.hero .name{ font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:clamp(78px,26vw,126px); line-height:.86; margin:8px 0 4px; letter-spacing:-.005em; }
.hero.rest .name{ font-size:clamp(64px,19vw,100px); }
.hero .name.long{ font-size:clamp(64px,21vw,104px); }
.hero .fig{ --fig:var(--onc); max-width:250px; margin:0 0 6px -6px; }
.hero .sub{ font-size:18px; font-weight:500; margin:0 0 2px; }
.hero .meta{ font-size:15px; opacity:.85; margin:0 0 18px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; text-align:center; min-height:52px; padding:0 18px; border-radius:14px; border:0; font-weight:600; font-size:17px; text-decoration:none; }
.btn-hero{ width:100%; min-height:58px; font-size:19px; background:var(--onc); color:var(--c); }
.hero.rest .btn-hero{ background:var(--ink); color:var(--bg); }
.btn-primary{ background:var(--ink); color:var(--bg); }
.btn-ghost{ background:transparent; border:1.5px solid var(--line); }
.btn-danger{ background:var(--box); color:var(--on-box); }
.resume{ border:2px solid var(--ink); }
.resume .btn{ flex:1; }

/* level */
.lvl{ display:flex; align-items:center; gap:14px; }
.lvl-n{ flex:none; width:56px; height:56px; border-radius:16px; background:var(--gold); color:var(--on-gold); display:grid; place-items:center; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:34px; line-height:1; }
.lvl-t{ flex:1; line-height:1.15; }
.lvl-t small{ display:block; color:var(--muted); font-size:14px; }
.lvl-t b{ font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:30px; font-weight:700; }
.lvl-xp{ text-align:right; line-height:1; }
.lvl-xp b{ display:block; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:28px; }
.lvl-xp small{ color:var(--muted); font-size:13px; }
.bar{ height:12px; border-radius:6px; background:var(--surface2); overflow:hidden; margin:12px 0 6px; }
.bar i{ display:block; height:100%; width:0; background:var(--gold); border-radius:6px; transition:width 1s cubic-bezier(.2,.8,.2,1); }
.bar i.red{ background:var(--box); }
.stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
.stat{ background:var(--bg); border-radius:12px; padding:8px 10px; }
.stat b{ display:block; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:28px; line-height:1.05; }
.stat span{ font-size:13px; color:var(--muted); }

/* week */
.week-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:12px 0 10px; }
.day{ text-align:center; font-size:13px; color:var(--muted); }
.dot{ display:block; width:34px; height:34px; margin:0 auto 4px; border-radius:50%; border:2px dashed var(--pc, var(--line)); }
.dot.off{ border-style:dotted; opacity:.6; }
.dot.done{ border:0; background:var(--dc); }
.dot.today{ border-style:solid; border-color:var(--ink); }
.dot.done.today{ box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink); }
.chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.chip{ min-height:44px; padding:0 16px; border-radius:22px; border:2px solid var(--c); background:transparent; font-weight:600; }
.chip.on{ background:var(--c); color:var(--onc); }
.sec-h{ font-size:19px; font-weight:600; margin:22px 2px -4px; }

/* badges */
.badges{ display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:12px 8px; margin-top:10px; }
.bdg{ text-align:center; font-size:13px; line-height:1.25; }
.bdg .m{ width:58px; height:58px; margin:0 auto 6px; border-radius:50%; display:grid; place-items:center; font-size:28px; background:var(--gold); box-shadow:inset 0 -4px 0 rgba(0,0,0,.15); }
.bdg b{ display:block; font-weight:600; }
.bdg span{ color:var(--muted); }
.bdg.locked .m{ background:transparent; border:2px dashed var(--line); box-shadow:none; filter:grayscale(1); opacity:.45; }
.bdg.locked b{ color:var(--muted); }

/* plan */
.seg{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:14px; }
.seg button{ min-height:46px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-weight:600; font-size:15px; padding:0 4px; line-height:1.15; }
.seg button[aria-pressed="true"]{ background:var(--c); color:var(--onc); border-color:var(--c); }
.scroll{ overflow-x:auto; margin:8px 0; }
table.rot{ border-collapse:collapse; width:100%; min-width:380px; font-size:14px; }
.rot th,.rot td{ padding:6px 4px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
.rot th{ font-weight:600; color:var(--muted); }
.tag{ display:inline-flex; align-items:center; gap:5px; }
.tag::before{ content:""; width:9px; height:9px; border-radius:50%; background:var(--c); flex:none; }
.wl{ list-style:none; padding:0; margin:6px 0 0; }
.wl li{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); }
.wl li:last-child{ border-bottom:0; }
.wl small{ color:var(--muted); white-space:nowrap; }
details.ex{ border-bottom:1px solid var(--line); }
details.ex:last-child{ border-bottom:0; }
details.ex summary{ display:flex; gap:12px; align-items:center; padding:12px 0; cursor:pointer; list-style:none; }
details.ex summary::-webkit-details-marker{ display:none; }
.ex-n{ flex:none; width:30px; height:30px; border-radius:50%; background:var(--c); color:var(--onc); display:grid; place-items:center; font-weight:600; font-size:15px; }
.ex-t{ display:flex; flex-direction:column; line-height:1.3; flex:1; }
.ex-t small{ color:var(--muted); font-size:14px; }
.ex-tm{ color:var(--muted); font-size:14px; }
.ex-b{ padding:0 0 14px 42px; font-size:16px; }
.ex-b .fig{ margin:0 0 8px; max-width:240px; }
.ex-b ul{ margin:0 0 8px; padding-left:18px; }
.ex-b li{ margin-bottom:4px; }
.warn{ border-left:4px solid var(--box); padding:6px 10px; background:var(--surface2); border-radius:0 10px 10px 0; font-size:15px; }
.vid{ display:inline-flex; align-items:center; gap:8px; min-height:44px; font-weight:600; color:inherit; text-decoration:underline; text-underline-offset:3px; margin-right:16px; }
.vid svg{ flex:none; }

/* record */
.wrow{ display:flex; gap:10px; margin-top:10px; }
.wrow input{ flex:1; min-width:0; min-height:52px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; font-size:20px; padding:0 14px; }
.wbig{ display:flex; align-items:baseline; gap:8px; margin:8px 0 2px; }
.wbig .cond{ font-weight:700; font-size:52px; line-height:1; }
.ok{ color:var(--pull); font-weight:600; } .mid{ color:var(--amber-text); font-weight:600; } .bad{ color:var(--box); font-weight:600; }
details.ses{ border-bottom:1px solid var(--line); }
details.ses:last-child{ border-bottom:0; }
details.ses summary{ display:flex; justify-content:space-between; gap:10px; padding:12px 0; cursor:pointer; list-style:none; }
details.ses summary::-webkit-details-marker{ display:none; }
.ses-b{ padding:0 0 12px; font-size:15px; }
.ses-b p{ margin:0 0 4px; }

/* tabbar */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
.tabbar-in{ max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); }
.tab{ position:relative; min-height:58px; background:none; border:0; color:var(--muted); font-weight:500; font-size:16px; }
.tab[aria-selected="true"]{ color:var(--ink); font-weight:600; }
.tab[aria-selected="true"]::before{ content:""; position:absolute; top:0; left:32%; right:32%; height:3px; border-radius:0 0 3px 3px; background:var(--ink); }

/* runner */
.runner{ position:fixed; top:0; left:0; right:0; bottom:0; z-index:50; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
.runner[hidden]{ display:none; }
.runner[data-phase="round"]{ background:var(--box); color:var(--on-box); --fig:var(--on-box); }
.r-head{ display:flex; align-items:center; gap:8px; padding:10px 12px; width:100%; max-width:560px; margin:0 auto; }
.icon-btn{ flex:none; width:44px; height:44px; border-radius:12px; border:0; background:var(--surface2); display:grid; place-items:center; color:inherit; }
.runner[data-phase="round"] .icon-btn{ background:rgba(255,255,255,.18); }
.r-title{ flex:1; text-align:center; font-weight:600; line-height:1.2; }
.r-title small{ display:block; font-weight:400; font-size:13px; opacity:.75; }
.xp{ display:inline-block; margin-top:3px; font-size:13px; font-weight:600; padding:1px 9px; border-radius:10px; background:var(--gold); color:var(--on-gold); }
.r-prog{ height:4px; background:var(--line); }
.r-prog i{ display:block; height:100%; background:var(--c); transition:width .3s; }
.runner[data-phase="round"] .r-prog{ background:rgba(255,255,255,.25); }
.runner[data-phase="round"] .r-prog i{ background:var(--on-box); }
.r-body{ flex:1; overflow-y:auto; padding:12px 18px 18px; width:100%; max-width:560px; margin:0 auto; }
.r-foot{ display:flex; flex-wrap:wrap; gap:10px; padding:10px 16px 14px; width:100%; max-width:560px; margin:0 auto; }
.r-foot .btn{ flex:1; min-height:60px; font-size:19px; }
.runner[data-phase="round"] .btn-primary{ background:var(--on-box); color:var(--box); }
.runner[data-phase="round"] .btn-ghost{ border-color:rgba(255,255,255,.5); }
.cf{ width:100%; margin:0 0 4px; font-weight:600; }
.r-k{ font-size:15px; opacity:.8; margin:0; }
.r-name{ font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:clamp(40px,11vw,56px); line-height:.95; margin:4px 0 6px; }
.r-target{ font-size:19px; font-weight:600; margin:0 0 2px; }
.r-last{ color:var(--muted); font-size:15px; margin:0; display:flex; flex-wrap:wrap; gap:4px 14px; }
.r-last b{ color:var(--amber-text); font-weight:600; }
.runner .fig{ max-width:260px; }
.ringwrap{ position:relative; width:min(58vw,230px); aspect-ratio:1/1; margin:6px auto 8px; }
.ringwrap svg{ position:absolute; top:0; left:0; width:100%; height:100%; transform:rotate(-90deg); }
.ring-bg{ fill:none; stroke:var(--line); stroke-width:11; }
.ring-fg{ fill:none; stroke:var(--c); stroke-width:11; stroke-linecap:round; }
.ringwrap.rest .ring-fg{ stroke:var(--ink); }
.runner[data-phase="round"] .ring-bg{ stroke:rgba(255,255,255,.25); }
.runner[data-phase="round"] .ring-fg{ stroke:var(--on-box); }
.ringwrap .big{ position:absolute; top:0; left:0; right:0; bottom:0; display:grid; place-items:center; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:clamp(62px,18vw,96px); line-height:1; font-variant-numeric:tabular-nums; }
.big-sw{ font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:clamp(64px,20vw,96px); line-height:1; text-align:center; font-variant-numeric:tabular-nums; color:var(--c); margin:4px 0; }
.r-desc{ font-size:18px; text-align:center; max-width:30em; margin:0 auto 8px; }
.r-next{ text-align:center; font-size:18px; font-weight:500; margin:0; }
.iv{ text-align:center; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:44px; line-height:1; margin:0 0 8px; }
.note{ text-align:center; font-size:15px; opacity:.9; }
.coach{ text-align:center; font-size:16px; color:var(--muted); margin-top:10px; }
.tip{ border-left:4px solid var(--gold); background:var(--surface); padding:8px 12px; border-radius:0 10px 10px 0; font-size:15px; margin:10px 0 0; }
.sw{ text-align:center; margin-top:4px; }
.stepper{ display:flex; align-items:center; justify-content:center; gap:20px; margin:12px 0 0; }
.stepper button{ width:64px; height:64px; border-radius:50%; border:0; background:var(--surface2); font-size:32px; font-weight:600; line-height:1; }
.stepper output{ font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:88px; line-height:1; min-width:2.2ch; text-align:center; font-variant-numeric:tabular-nums; transition:color .2s; }
.stepper output.pr{ color:var(--amber-text); }
.unit{ text-align:center; color:var(--muted); font-size:15px; margin:2px 0 6px; }
.unit b{ color:var(--amber-text); }
details.how{ background:var(--surface); border-radius:14px; padding:10px 14px; margin-top:12px; }
.runner[data-phase="round"] details.how{ background:rgba(255,255,255,.14); }
details.how summary{ font-weight:600; cursor:pointer; min-height:30px; }
details.how ul{ margin:8px 0 6px; padding-left:20px; }
details.how li{ margin-bottom:4px; }
details.how p{ font-size:16px; }
.center{ text-align:center; }
.gain{ text-align:center; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:72px; line-height:1; color:var(--amber-text); margin:6px 0 2px; }
.lvup{ text-align:center; background:var(--gold); color:var(--on-gold); border-radius:14px; padding:10px; font-weight:600; margin:10px 0; }
ul.sum{ list-style:none; padding:0; margin:12px 0; }
ul.sum li{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
ul.sum span{ text-align:right; font-variant-numeric:tabular-nums; }
ul.sum em{ font-style:normal; color:var(--amber-text); font-weight:600; }

.toast{ position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:60; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:500; max-width:90vw; opacity:0; pointer-events:none; transition:opacity .2s; }
.toast.show{ opacity:1; }
.xpf{ position:fixed; left:50%; top:calc(84px + env(safe-area-inset-top,0px)); z-index:65; pointer-events:none; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:36px; color:var(--gold); text-shadow:0 2px 0 rgba(0,0,0,.2); animation:xpup 1.3s ease-out forwards; }
@keyframes xpup{ 0%{ opacity:0; transform:translate(-50%,12px); } 20%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%,-44px); } }
.flash{ position:fixed; left:50%; top:34%; z-index:66; pointer-events:none; background:var(--gold); color:var(--on-gold); padding:14px 24px; border-radius:20px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:pop 2s ease forwards; }
.flash b{ display:block; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:44px; line-height:1; }
.flash small{ font-size:16px; font-weight:600; }
@keyframes pop{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.6); } 12%{ opacity:1; transform:translate(-50%,-50%) scale(1.06); } 20%{ transform:translate(-50%,-50%) scale(1); } 82%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1); } }
#confetti{ position:fixed; top:0; left:0; width:100%; height:100%; z-index:70; pointer-events:none; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

/* links + demo button */
.links{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; margin-top:6px; }
.links.center{ justify-content:center; }
.links .vid{ margin-right:0; }
.demo-btn{ display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:0 14px; border-radius:22px; border:0; background:var(--c); color:var(--onc); font-weight:600; font-size:15px; }
.runner[data-phase="round"] .demo-btn{ background:var(--on-box); color:var(--box); }
.runner[data-phase="breath"] .demo-btn{ background:#E6F0FA; color:#14283B; }
.small-c{ text-align:center; font-size:15px; opacity:.8; }
ul.plain{ padding-left:20px; margin:8px 0; }
ul.plain li{ margin-bottom:6px; }

/* calm meditation screens */
.runner[data-phase="breath"]{ background:#14283B; color:#E6F0FA; --c:#8FC1EC; }
.runner[data-phase="breath"] .icon-btn{ background:rgba(255,255,255,.12); }
.runner[data-phase="breath"] .r-prog{ background:rgba(255,255,255,.15); }
.runner[data-phase="breath"] .btn-primary{ background:#E6F0FA; color:#14283B; }
.runner[data-phase="breath"] .btn-ghost{ border-color:rgba(255,255,255,.4); }
.runner[data-phase="breath"] details.how{ background:rgba(255,255,255,.08); }
.runner[data-phase="breath"] .xp{ background:rgba(255,255,255,.15); color:#E6F0FA; }
.breath{ position:relative; width:min(62vw,240px); aspect-ratio:1/1; margin:14px auto 12px; display:grid; place-items:center; }
.bring{ position:absolute; top:0; left:0; right:0; bottom:0; border-radius:50%; border:2px dashed rgba(143,193,236,.4); }
.bcirc{ position:absolute; top:0; left:0; right:0; bottom:0; border-radius:50%; background:radial-gradient(circle at 50% 42%, rgba(143,193,236,.6), rgba(143,193,236,.16) 70%); border:2px solid rgba(143,193,236,.9); transform:scale(.5); will-change:transform; }
.blabel{ position:relative; text-align:center; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:26px; line-height:1.05; padding:0 18px; }
.blabel small{ display:block; font-size:46px; margin-top:4px; }

/* demo sheet */
.demo{ position:fixed; top:0; left:0; right:0; bottom:0; z-index:80; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; }
.demo-card{ width:100%; max-width:560px; max-height:92%; overflow-y:auto; background:var(--bg); color:var(--ink); border-radius:22px 22px 0 0; padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px)); }
.demo-card.calm{ background:#14283B; color:#E6F0FA; --c:#8FC1EC; }
.demo-card.calm .icon-btn{ background:rgba(255,255,255,.12); }
.demo-card.calm .btn-ghost{ border-color:rgba(255,255,255,.4); }
.demo-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.demo-top b{ font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:32px; line-height:1; }
.demo-card .fig{ max-width:300px; margin:8px auto; }
.demo-step{ text-align:center; font-size:14px; opacity:.7; margin:4px 0 0; }
.demo-cap{ min-height:3.1em; font-size:20px; font-weight:500; text-align:center; margin:4px 0 10px; }
.demo-bar{ height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
.demo-card.calm .demo-bar{ background:rgba(255,255,255,.15); }
.demo-bar i{ display:block; height:100%; width:0; background:var(--c); }
.demo-foot{ display:flex; gap:12px; align-items:center; justify-content:space-between; margin-top:12px; }
.demo-foot .btn{ min-height:48px; }

/* ---------- XP, levels, badges ---------- */
function scoreSession(s, best){
  if(s.w === 'walk') return { xp: Math.round(s.m), reps:0, secs:0, prs:0, prList:[], full:true, nb:[], bx:0 };
  if(s.w === 'flex'){ var f = s.f || {}; return { xp: ((f.st || 0) >= 4 || (f.md || 0) >= 3 || (f.cd || 0) >= 5 ? 30 : 0) + (f.st || 0)*4 + (f.md || 0)*3 + (f.cd || 0)*4, reps:0, secs:0, prs:0, prList:[], full:(f.st || 0) >= FLEX.stretch.length, nb:[], bx:0, flex:true }; }
  var d = W[s.w], reps = 0, secs = 0, prs = 0, full = true, nb = [], prList = [];
  d.main.forEach(function(ex){
    var l = (s.l && s.l[ex.id]) || [];
    for(var i = 0; i < ex.sets; i++) if(l[i] == null) full = false;
    var v = l.filter(function(x){ return x != null; });
    if(!v.length) return;
    v.forEach(function(x){ if(ex.unit === 'sec') secs += x; else reps += x; });
    var mx = Math.max.apply(null, v);
    if(best[ex.id] != null && mx > best[ex.id]){ prs++; prList.push(ex.id); }
    if(best[ex.id] == null || mx > best[ex.id]) nb.push([ex.id, mx]);
  });
  var bx = s.bx || 0;
  return { xp: 40 + reps + Math.round(secs/5) + bx*12 + (full ? 30 : 0) + prs*25, reps:reps, secs:secs, prs:prs, prList:prList, full:full, nb:nb, bx:bx };
}
function statsOf(list){
  var ss = list.slice().sort(function(a,b){ return a.t - b.t; });
  var best = {}, xp = 0, prs = 0, reps = 0, rounds = 0, weeks = {}, vig = {}, count = 0, flex = 0;
  ss.forEach(function(s){
    var r = scoreSession(s, best);
    xp += r.xp; prs += r.prs; reps += r.reps; rounds += r.bx;
    if(s.w === 'flex') flex++; else if(s.w !== 'walk') count++;
    r.nb.forEach(function(p){ best[p[0]] = p[1]; });
    var wk = weekStart(new Date(s.t)).getTime();
    if(s.w !== 'walk') weeks[wk] = (weeks[wk] || 0) + 1;
    vig[wk] = (vig[wk] || 0) + vigEq(s);
  });
  var maxWeek = 0, maxVig = 0;
  Object.keys(weeks).forEach(function(k){ maxWeek = Math.max(maxWeek, weeks[k]); });
  Object.keys(vig).forEach(function(k){ maxVig = Math.max(maxVig, vig[k]); });
  var w = weekStart(new Date()), streak = 0, thisVig = vig[w.getTime()] || 0;
  if((weeks[w.getTime()] || 0) < 5) w.setDate(w.getDate() - 7);
  while((weeks[w.getTime()] || 0) >= 5){ streak++; w.setDate(w.getDate() - 7); }
  return { xp:xp, prs:prs, reps:reps, rounds:rounds, best:best, count:count, flex:flex, maxWeek:maxWeek, streak:streak, maxVig:maxVig, thisVig:thisVig };
}
function levelOf(xp){
  var i = 0; while(i+1 < LEVELS.length && xp >= LEVELS[i+1][0]) i++;
  var cur = LEVELS[i], nxt = LEVELS[i+1];
  return { n:i+1, name:cur[1], from:cur[0], to:nxt ? nxt[0] : null, nextName:nxt ? nxt[1] : null, pct: nxt ? Math.min(100, (xp-cur[0])/(nxt[0]-cur[0])*100) : 100 };
}

var AC = null;
function audioInit(){ try{ if(!AC){ var C = window.AudioContext || window.webkitAudioContext; if(C) AC = new C(); } if(AC && AC.state === 'suspended') AC.resume(); }catch(e){} }
function beep(f, d){
  if(soundMode < 1 || !AC) return;
  try{
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.05);
  }catch(e){}
}
function vib(ms){ try{ if(soundMode >= 1 && navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
var VOICE = null, HAS_TTS = 'speechSynthesis' in window;
function pickVoice(){ try{ var vs = window.speechSynthesis.getVoices(); VOICE = vs.filter(function(v){ return /^en[-_]IN/i.test(v.lang); })[0] || vs.filter(function(v){ return /^en[-_]/i.test(v.lang); })[0] || null; }catch(e){} }
if(HAS_TTS){ pickVoice(); try{ window.speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function say(text){
  if(soundMode < 2 || !HAS_TTS) return;
  try{ window.speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); if(VOICE){ u.voice = VOICE; u.lang = VOICE.lang; } else u.lang = 'en-IN'; u.rate = 1.02; window.speechSynthesis.speak(u); }catch(e){}
}

var CF = { parts:[], raf:0, ctx:null };
function confetti(n){
  if(RM) return;
  var c = $('#confetti'), dpr = window.devicePixelRatio || 1;
  if(!CF.raf){ c.width = innerWidth*dpr; c.height = innerHeight*dpr; CF.ctx = c.getContext('2d'); CF.ctx.setTransform(dpr,0,0,dpr,0,0); }
  var cs = getComputedStyle(document.documentElement);
  var cols = ['--pull','--push','--legs','--box'].map(function(v){ return cs.getPropertyValue(v).trim() || '#E0A00F'; });
  for(var i = 0; i < n; i++){
    CF.parts.push({ x:innerWidth/2 + (Math.random()-.5)*120, y:innerHeight*0.32, vx:(Math.random()-.5)*11, vy:-Math.random()*10-4, w:Math.random()*6+5, h:Math.random()*4+4, c:cols[i%4], a:Math.random()*6, va:(Math.random()-.5)*0.35, life:0 });
  }
  if(!CF.raf) CF.raf = requestAnimationFrame(cfStep);
}
function cfStep(){
  var ctx = CF.ctx; ctx.clearRect(0, 0, innerWidth, innerHeight);
  CF.parts.forEach(function(p){
    p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life++;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
  });
  CF.parts = CF.parts.filter(function(p){ return p.y < innerHeight + 30 && p.life < 260; });
  if(CF.parts.length) CF.raf = requestAnimationFrame(cfStep); else { CF.raf = 0; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

function fmtMin(m){ m = Math.round(m); return m < 60 ? m + ' min' : Math.floor(m/60) + ' h ' + (m % 60) + ' min'; }
function timeLabel(d){ return d.toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit' }); }
function periodRow(label, from, kg){
  var list = S.sessions.filter(function(s){ return s.t >= from; });
  var n = list.filter(function(s){ return s.w !== 'walk'; }).length, walks = list.length - n, min = 0, kc = 0;
  list.forEach(function(s){ min += activeMin(s); kc += kcalOf(s, kg); });
  return '<li><b>' + label + '</b><span style="text-align:right">' + n + ' session' + (n === 1 ? '' : 's') + (walks ? ' + ' + walks + ' walk' + (walks === 1 ? '' : 's') : '') + '<br><small>' + fmtMin(min) + ' · ' + num(kc) + ' kcal</small></span></li>';
}
function sessionRows(s, kg){
  var ph = phaseSecs(s), rows = '';
  var end = new Date(s.t + activeMin(s)*60000);
  rows += '<p>' + (s.w === 'walk' ? 'Logged at ' + timeLabel(new Date(s.t)) : 'Started ' + timeLabel(new Date(s.t)) + ', finished ' + timeLabel(end)) + '</p>';
  rows += '<p><b>Total: ' + fmtMin(activeMin(s)) + ' · about ' + num(kcalOf(s, kg)) + ' kcal</b></p>';
  rows += '<ul class="wl">' + PH_ORDER.filter(function(p){ return ph[p] >= 30; }).map(function(p){
    var one = {}; one[p] = ph[p];
    return '<li><span>' + PH_NAMES[p] + '</span><small>' + fmtMin(ph[p]/60) + ' · ' + kcalOf({ ph:one }, kg) + ' kcal</small></li>';
  }).join('') + '</ul>' + (s.ph || s.w === 'walk' ? '' : '<p class="small">Time split estimated (saved before time tracking).</p>');
  if(s.w === 'flex'){ var f = s.f || {}; rows += '<p>Fast cardio: ' + (f.cd || 0) + ' min</p><p>Stretches: ' + (f.st || 0) + ' / ' + FLEX.stretch.length + '</p><p>Meditation: ' + (f.md || 0) + ' min</p>'; }
  else if(s.w !== 'walk'){
    var reps = 0, secs = 0;
    rows += W[s.w].main.map(function(ex){
      var l = s.l && s.l[ex.id], v = l ? l.filter(function(x){ return x != null; }) : [];
      v.forEach(function(x){ if(ex.unit === 'sec') secs += x; else reps += x; });
      return '<p>' + esc(ex.name) + ': ' + (v.length ? v.join(', ') + ' ' + unitWord(ex) + (ex.side ? ' each side' : '') : 'skipped') + '</p>';
    }).join('') + '<p>Boxing: ' + (s.bx || 0) + ' rounds of ' + (s.bxm || 2) + ' min</p><p class="small">In total: ' + reps + ' reps' + (secs ? ', ' + secs + ' sec of holds' : '') + '.</p>';
  }
  return rows;
}
function renderRecord(){
  var st = statsOf(S.sessions), kg = bodyKg(), now = new Date();
  var h = '<header class="top"><h1>Record</h1></header>';
  h += '<section class="card"><h3>Time and calories</h3><ul class="wl">' +
    periodRow('Today', new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(), kg) +
    periodRow('This week', weekStart(now).getTime(), kg) +
    periodRow('This month', new Date(now.getFullYear(), now.getMonth(), 1).getTime(), kg) +
    periodRow('All time', 0, kg) + '</ul>' +
    '<p class="small" style="margin-top:8px">Calories are an estimate for ' + kg + ' kg' + (S.kg ? '' : ' (default; save your weight below)') + ', from standard activity values. Real numbers vary by person.</p></section>';
  h += '<section class="card"><h3>Body weight</h3><p class="small">Used only to estimate calories. Weigh in the morning before eating.</p>' +
    (S.kg ? '<p class="wbig"><span class="cond">' + S.kg.v + '</span> kg <span class="small">' + esc(dateLabel(new Date(S.kg.t))) + '</span></p>' : '') +
    '<div class="wrow"><label for="wkg" class="sr">Weight in kg</label><input id="wkg" type="number" inputmode="decimal" min="25" max="250" step="0.1" placeholder="kg"><button class="btn btn-primary" data-act="kg-save">Save</button></div></section>';
  var ws = S.waist.slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  var last = ws[ws.length-1], stat = '';
  if(last){
    if(last.cm < 85) stat = '<p class="ok">Within target.</p>';
    else if(last.cm < 90) stat = '<p class="mid">Above target. Aim for under 85 cm.</p>';
    else stat = '<p class="bad">90 cm or more: belly fat risk. Watch what you eat.</p>';
  }
  h += '<section class="card"><h3>Waist</h3><p class="small">Once a month, in the morning on an empty stomach, just above the navel. Target: under 85 cm (half your height).</p>' +
    (last ? '<p class="wbig"><span class="cond">' + last.cm + '</span> cm <span class="small">' + esc(dateLabel(fromIso(last.d))) + '</span></p>' + stat : '') +
    '<div class="wrow"><label for="wcm" class="sr">Waist in cm</label><input id="wcm" type="number" inputmode="decimal" min="50" max="150" step="0.5" placeholder="cm"><button class="btn btn-primary" data-act="waist-save">Save</button></div>' +
    (ws.length > 1 ? '<ul class="wl">' + ws.slice(-6, -1).reverse().map(function(x){ return '<li><span>' + x.cm + ' cm</span><small>' + esc(dateLabel(fromIso(x.d))) + '</small></li>'; }).join('') + '</ul>' : '') + '</section>';
  var ss = sortedSessions().reverse();
  h += '<section class="card"><h3>History</h3><p class="small">Tap a session for full details.</p>';
  if(!ss.length){
    h += '<p>Nothing saved yet. Finish your first session and tap “Save”; it will show up here.</p>';
  } else {
    h += ss.slice(0, 60).map(function(s){
      return '<details class="ses"><summary><span class="tag" style="' + wvars(s.w === 'walk' ? 'flex' : s.w) + '"><b>' + esc(s.w === 'flex' ? 'Stretch + Med' : sesName(s.w)) + '</b></span><span class="small">' + esc(dateLabel(new Date(s.t))) + ' · ' + fmtMin(activeMin(s)) + ' · ' + num(kcalOf(s, kg)) + ' kcal</span></summary><div class="ses-b">' + sessionRows(s, kg) + '</div></details>';
    }).join('');
  }
  h += '</section>';
  var bestRows = ORDER.map(function(w){ return W[w].main.filter(function(ex){ return st.best[ex.id] != null; }).map(function(ex){ return '<li><span class="tag" style="' + wvars(w) + '">' + esc(ex.name) + '</span><b>' + st.best[ex.id] + ' ' + unitWord(ex) + '</b></li>'; }).join(''); }).join('');
  if(bestRows) h += '<section class="card"><h3>Your best sets</h3><p class="small">Most in a single set.</p><ul class="wl">' + bestRows + '</ul></section>';
  h += levelCard(st);
  var got = BADGES.filter(function(b){ return b.test(st); }).length;
  h += '<section class="card"><div class="card-h"><h3>Badges</h3><span class="small">' + got + ' / ' + BADGES.length + '</span></div><div class="badges">' + BADGES.map(function(b){
    var ok = b.test(st);
    return '<div class="bdg' + (ok ? '' : ' locked') + '"><div class="m" aria-hidden="true">' + b.e + '</div><b>' + esc(b.name) + '</b><span>' + (ok ? 'Earned' : esc(b.how)) + '</span></div>';
  }).join('') + '</div></section>';
  if(!window.claude){
    h += '<section class="card"><h3>Backup</h3><p class="small">Your record is saved only on this phone. If you change phones or clear browser data it will be gone. Take a backup file once a month.</p><div class="row"><button class="btn btn-primary" data-act="export">Download backup</button><label class="btn btn-ghost" for="impf">Restore from backup</label><input id="impf" type="file" accept="application/json,.json" class="sr"></div></section>';
  } else {
    h += '<p class="small" style="margin:14px 4px 0">' + (cloud ? 'Your record is saved to your Claude account and shows on your other devices too.' : 'Your record is saved only in this browser for now.') + '</p>';
  }
  return h;
}

/* ---------- runner ---------- */
var R = null, tickH = null;
function buildSteps(w, adv){
  var st = [];
  if(w === 'flex'){
    var C = FLEX.cardio;
    st.push({ type:'timed', phase:'cardio', name:C.name, secs:C.secs, segs:C.segs, anim:C.segs[0][2], cues:C.cues, helps:C.helps, link:C.link, demo:'cd:0' });
    FLEX.stretch.forEach(function(x, k){ st.push({ type:'timed', phase:'stretch', name:x.name, secs:segsTotal(x.segs), segs:x.segs, anim:x.anim, cues:x.cues, helps:x.helps, link:x.link, k:k+1, of:FLEX.stretch.length, demo:'st:' + k }); });
    st.push({ type:'medprep', phase:'med' });
    FLEX.med.forEach(function(x, k){ st.push({ type:'breath', phase:'med', name:x.name, secs:x.secs, pattern:x.pattern, prompts:x.prompts || null, cues:x.cues, helps:x.helps, link:x.link, k:k+1, of:FLEX.med.length, demo:'md:' + k }); });
    st.push({ type:'done', phase:'done' });
    return st;
  }
  var d = W[w];
  d.warmup.forEach(function(m, k){ st.push({ type:'timed', phase:'warmup', name:m.name, secs:m.secs, desc:m.desc, link:m.link, anim:m.anim, k:k+1, of:d.warmup.length, demo:'wu:' + w + ':' + k }); });
  d.main.forEach(function(ex, ei){
    for(var s = 1; s <= ex.sets; s++){
      st.push({ type:'set', phase:'main', ex:ex.id, set:s, ei:ei+1, of:d.main.length });
      if(!(ei === d.main.length-1 && s === ex.sets)) st.push({ type:'rest', phase:'main', secs:ex.rest });
    }
  });
  var bp = adv ? BOX.adv : BOX.base;
  st.push({ type:'boxprep', phase:'box' });
  bp.rounds.forEach(function(r, k){
    st.push({ type:'timed', phase:'box', round:k+1, of:bp.rounds.length, secs:bp.secs, desc:r.desc, link:r.link, segs:r.segs || null, demo:'box:' + k });
    if(k < bp.rounds.length-1) st.push({ type:'rest', phase:'box', secs:60 });
  });
  st.push({ type:'done', phase:'done' });
  return st;
}
function remaining(){ var t = R && R.timer; if(!t) return 0; return t.paused ? t.rem : Math.max(0, t.endAt - Date.now()); }
function swSec(){ if(!R.sw) return 0; return R.sw.running ? Math.floor((Date.now() - R.sw.startAt)/1000) : R.sw.final; }
function saveRun(){ if(R) lsSet(RUN_KEY, { w:R.w, adv:R.adv, i:R.i, logs:R.logs, startedAt:R.startedAt, boxDone:R.boxDone, stDone:R.stDone, mdDone:R.mdDone, cdDone:R.cdDone, ph:R.ph }); }
/* time per phase for the record; one step counts at most 10 min (phone left aside) */
function phaseKey(st){ if(!st || st.type === 'done') return null; if(st.type === 'boxprep' || st.type === 'medprep') return 'prep'; if(st.phase === 'box' && st.type === 'rest') return 'boxrest'; return st.phase; }
function tally(){ var now = Date.now(), k = phaseKey(R.steps[R.i]); if(k && R.phAt) R.ph[k] = (R.ph[k] || 0) + Math.min((now - R.phAt)/1000, 600); R.phAt = now; }
function flexF(){ var md = 0, cd = 0; Object.keys(R.mdDone).forEach(function(k){ md += R.mdDone[k]; }); Object.keys(R.cdDone).forEach(function(k){ cd += R.cdDone[k]; }); return { st:Object.keys(R.stDone).length, md:Math.round(md/60), cd:Math.round(cd/60), cv:cardioEq(cd) }; }
function curSession(){ return R.w === 'flex' ? { w:'flex', f:flexF() } : { w:R.w, l:R.logs, bx:R.boxDone, bxm:R.adv ? 3 : 2 }; }
function runXP(){ return scoreSession(curSession(), R.best).xp; }

function openRunner(){
  $('#runner').hidden = false;
  document.body.style.overflow = 'hidden';
  if(!tickH) tickH = setInterval(onTick, 200);
  wakeOn();
}
function newRun(w, adv, extra){
  var st = statsOf(S.sessions);
  return Object.assign({ w:w, adv:adv, steps:buildSteps(w, adv), i:0, logs:{}, startedAt:Date.now(), boxDone:0, stDone:{}, mdDone:{}, cdDone:{}, ph:{}, phAt:Date.now(), confirm:false, best:st.best, pr:{} }, extra || {});
}
function startRun(w){ audioInit(); R = newRun(w, isAdv()); openRunner(); go(0); }
function resumeRun(){
  var run = lsGet(RUN_KEY); if(!run || !(ORDER.indexOf(run.w) >= 0 || run.w === 'flex')) return;
  audioInit();
  R = newRun(run.w, !!run.adv, { logs:run.logs || {}, startedAt:run.startedAt, boxDone:run.boxDone || 0, stDone:run.stDone || {}, mdDone:run.mdDone || {}, cdDone:run.cdDone || {}, ph:run.ph || {} });
  openRunner(); go(Math.min(run.i || 0, R.steps.length-1));
}
function endRun(){
  R = null; clearInterval(tickH); tickH = null; wakeOff(); lsDel(RUN_KEY);
  if(HAS_TTS){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  $('#runner').hidden = true; $('#runner').innerHTML = ''; document.body.style.overflow = '';
  render();
}
function go(i){
  tally();
  R.i = i; R.timer = null; R.sw = null; R.confirm = false; R.bph = null; R.bcyc = 0; R.bprompt = -1;
  var st = R.steps[i];
  if(st.type === 'timed' || st.type === 'rest' || st.type === 'breath') R.timer = { endAt:Date.now() + st.secs*1000, rem:st.secs*1000, total:st.secs*1000, paused:false, lb:null, seg:null };
  if(st.type === 'set'){
    var ex = exById(R.w, st.ex), mine = R.logs[ex.id], last = lastLogs(ex.id);
    R.val = (mine && mine[st.set-1] != null) ? mine[st.set-1] : (last && last[st.set-1] != null ? last[st.set-1] : ex.lo);
    say(st.set === 1 ? ex.name + '. Set one.' : 'Set ' + st.set + '.');
  }
  if(st.type === 'timed' && st.phase === 'warmup') say(st.name);
  if(st.type === 'timed' && st.phase === 'stretch') say(st.name + '. ' + st.segs[0][1] + '.');
  if(st.type === 'timed' && st.phase === 'cardio') say('Fast cardio. ' + st.segs[0][1] + '.');
  if(st.type === 'timed' && st.phase === 'box') say('Round ' + st.round + '. Go!');
  if(st.type === 'boxprep') say('Boxing time. Gloves on.');
  if(st.type === 'medprep') say('Now meditation. Sit comfortably.');
  if(st.type === 'breath') say(st.name + '.');
  if(st.type === 'done') prepDone();
  saveRun(); renderRunner();
  var b = document.querySelector('#runner .r-body'); if(b) b.scrollTop = 0;
  if(st.type === 'done'){
    beep(784, 0.18); setTimeout(function(){ beep(1046, 0.4); }, 200);
    setTimeout(function(){ say(R && R.final.lvUp ? 'Well done! Level up!' : 'Well done! All finished.'); }, 300);
    confetti(R.final.lvUp ? 220 : 140);
    var bi = document.querySelector('#runner .bar i[data-w]');
    if(bi) setTimeout(function(){ bi.style.width = bi.dataset.w + '%'; }, 250);
  }
}
function next(){
  var st = R.steps[R.i];
  if(R.timer){
    var el = (R.timer.total - remaining()) / 1000, half = el >= R.timer.total/2000;
    var b4 = runXP();
    if(st.type === 'timed' && st.phase === 'box' && half && R.boxDone < st.round) R.boxDone = st.round;
    if(st.type === 'timed' && st.phase === 'stretch' && half) R.stDone[R.i] = 1;
    if(st.type === 'breath') R.mdDone[R.i] = Math.max(R.mdDone[R.i] || 0, Math.min(st.secs, Math.round(el)));
    if(st.phase === 'cardio') R.cdDone[R.i] = Math.max(R.cdDone[R.i] || 0, Math.min(st.secs, Math.round(el)));
    xpFloat(runXP() - b4);
  }
  if(R.i < R.steps.length-1) go(R.i+1);
}
function prev(){ var j = R.i - 1; while(j > 0 && R.steps[j].type === 'rest') j--; if(j >= 0) go(j); }

function prepDone(){
  var base = curSession();
  var ph = {}, tot = 0;
  Object.keys(R.ph).forEach(function(k){ var v = Math.round(R.ph[k]); if(v > 0){ ph[k] = v; tot += v; } });
  var s = Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), t:R.startedAt, dur:Math.max(1, Math.round(tot/60)), ph:ph }, clone(base));
  var before = statsOf(S.sessions), after = statsOf(S.sessions.concat([s]));
  var lb = levelOf(before.xp), la = levelOf(after.xp);
  R.final = { s:s, vig:after.thisVig, gain:after.xp - before.xp, lb:lb, la:la, lvUp:la.n > lb.n, badges:BADGES.filter(function(b){ return b.test(after) && !b.test(before); }), sc:scoreSession(s, before.best) };
}

  s1:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',

function updateVal(){
  var st = R.steps[R.i]; if(st.type !== 'set') return;
  var ex = exById(R.w, st.ex), best = R.best[ex.id];

  if(u) u.innerHTML = unitWord(ex) + ' done' + (ex.side ? ' (each side)' : '') + (best != null && R.val > best ? ' <b>New best!</b>' : '');
}

function segAt(segs, elMs){
  var acc = 0, k = 0;
  for(; k < segs.length; k++){ if(elMs < (acc + segs[k][0])*1000) break; acc += segs[k][0]; }
  if(k >= segs.length){ k = segs.length-1; acc -= segs[k][0]; }
  return { k:k, left:(acc + segs[k][0])*1000 - elMs };
}
function updateClock(){
  if(!R) return;
  var st = R.steps[R.i];
  var clk = document.getElementById('clk');
  if(clk && R.timer){
    var ms = remaining(); clk.textContent = fmt(ms);
    var rg = document.getElementById('ring');
    if(rg) rg.setAttribute('stroke-dashoffset', (565.49 * (1 - ms / R.timer.total)).toFixed(1));
    if(st.segs){
      var sa = segAt(st.segs, R.timer.total - ms), k = sa.k;
      var iv = document.getElementById('iv');
      if(iv) iv.textContent = st.segs[k][1] + (st.segs.length > 1 ? '  ' + Math.max(0, Math.ceil(sa.left/1000)) : '');
      if(R.timer.seg !== k){
        if(R.timer.seg != null && !R.timer.paused){
          if(st.phase === 'stretch'){ beep(523, 0.18); setTimeout(function(){ beep(659, 0.22); }, 180); say(st.segs[k][1]); }
          else if(st.phase === 'cardio'){ beep(784, 0.15); setTimeout(function(){ beep(988, 0.22); }, 160); say(st.segs[k][1]); }
          else beep(k % 2 === 0 ? 990 : 520, 0.25);
        }
        R.timer.seg = k;
        if(st.phase === 'cardio'){ var cf = document.querySelector('#runner .r-body svg.fig'); if(cf && cf.getAttribute('data-anim') !== st.segs[k][2]) cf.setAttribute('data-anim', st.segs[k][2]); }
      }
    }
  }
  var pz = document.getElementById('pz');
  if(pz && R.timer) pz.textContent = R.timer.paused ? 'Resume' : 'Pause';
  var swEl = document.getElementById('sw');
  if(swEl && R.sw){
    var s = swSec(); swEl.textContent = fmtS(s);
    if(R.sw.running){
      R.val = s; updateVal();
      var ex = exById(R.w, st.ex);
      if(s >= ex.lo && !R.sw.b1){ R.sw.b1 = true; beep(880, 0.2); }
      if(s >= ex.hi && !R.sw.b2){ R.sw.b2 = true; beep(990, 0.4); vib(200); say('Target poora!'); }
    }
  }
}

/* breathing pacer: shared by the runner and the demo */
function breathState(pattern, elSec){
  var L = pattern.reduce(function(a, x){ return a + x[1]; }, 0), t = elSec % L, acc = 0, i = 0;
  for(; i < pattern.length; i++){ if(t < acc + pattern[i][1]) break; acc += pattern[i][1]; }
  if(i >= pattern.length) i = pattern.length - 1;
  var ph = pattern[i], p = (t - acc) / ph[1];
  var sc = ph[0] === 'in' ? 0.5 + 0.5*p : ph[0] === 'out' ? 1 - 0.5*p : ph[0] === 'hold' ? 1 : 0.5;
  return { i:i, cyc:Math.floor(elSec / L), label:ph[2], kind:ph[0], left:Math.max(1, Math.ceil(ph[1] - (t - acc))), scale:sc };
}
function paintBreath(root, b){
  var c = root.querySelector('.bcirc'), l = root.querySelector('[data-bl]') || root.querySelector('#bl'), n = root.querySelector('[data-bc]') || root.querySelector('#bc');
  if(c) c.style.transform = 'scale(' + (RM ? (b.scale > 0.75 ? 1 : 0.5) : b.scale).toFixed(3) + ')';
  if(l) l.textContent = b.label;
  if(n) n.textContent = b.left;
}
function breathFrame(){
  if(!R) return;
  var st = R.steps[R.i];
  if(st.type === 'medprep'){ var box = document.querySelector('#runner .breath'); if(box){ var e0 = (performance.now() - T0)/1000; paintBreath(box, breathState([['in',4,'In through the nose'],['out',6,'Out through the mouth']], e0)); } return; }
  if(st.type !== 'breath' || !R.timer) return;
  var el = (R.timer.total - remaining()) / 1000, b = breathState(st.pattern, el);
  var root = document.querySelector('#runner .breath'); if(root) paintBreath(root, b);
  var key = b.cyc + ':' + b.i;
  if(R.bph !== key && !R.timer.paused){
    if(R.bph != null){
      beep(b.kind === 'in' ? 440 : b.kind === 'out' ? 330 : 392, 0.22);
      if(b.cyc < 3) say(b.label);
    }
    R.bph = key;
  }
  if(st.prompts){
    var pi = Math.min(st.prompts.length - 1, Math.floor(el / (st.secs / st.prompts.length)));
    if(pi !== R.bprompt){ R.bprompt = pi; var bp = document.getElementById('bp'); if(bp) bp.textContent = st.prompts[pi]; if(pi > 0 || el > 1) say(st.prompts[pi]); }
  }
}

function onTick(){
  if(!R) return;
  updateClock();
  var t = R.timer; if(!t || t.paused) return;
  var st = R.steps[R.i], ms = remaining(), s = Math.ceil(ms/1000);
  if(st.type !== 'breath' && s <= 3 && s >= 1 && t.lb !== s){ t.lb = s; beep(660, 0.12); }
  if(ms <= 0){ beep(st.type === 'breath' ? 523 : 990, 0.45); vib(300); next(); }
}

var D = null;
function demoSpec(key){

  if(p[0] === 'ex'){ var ex = EXMAP[p[1]]; return { name:ex.name, anim:ex.anim, caps:ex.how, link:ex.link, c:ORDER.filter(function(w){ return W[w].main.indexOf(ex) >= 0; })[0] }; }
  if(p[0] === 'wu'){ var m = W[p[1]].warmup[+p[2]]; return { name:m.name, anim:m.anim, caps:m.desc.split('. ').map(function(x){ return x.replace(/\.$/, '') + '.'; }), link:m.link, c:p[1] }; }
  if(p[0] === 'cd'){ var cdx = FLEX.cardio; return { name:cdx.name, anim:'boxfast', caps:cdx.cues, link:cdx.link, c:'box' }; }
  if(p[0] === 'st'){ var x = FLEX.stretch[+p[1]]; return { name:x.name, anim:x.anim, caps:x.cues, link:x.link, c:'flex' }; }
  if(p[0] === 'md'){ var y = FLEX.med[+p[1]]; return { name:y.name, pattern:y.pattern, caps:y.cues, link:y.link, c:'flex' }; }
  if(p[0] === 'box'){ var r = (isAdv() ? BOX.adv : BOX.base).rounds[+p[1]]; return { name:'Round ' + (+p[1] + 1), anim:'box', caps:[r.desc, 'Hands always near your face.', 'After each punch, bring the hand straight back.'], link:r.link, c:'box' }; }
  return null;
}
function openDemo(key){
  var sp = demoSpec(key); if(!sp) return;

  audioInit();
  var caps = sp.caps.slice(0, 4), per = caps.length >= 3 ? 15 / caps.length : 5;
  var wasRunning = !!(R && R.timer && !R.timer.paused);
  if(wasRunning){ R.timer.rem = remaining(); R.timer.paused = true; updateClock(); }
  D = { sp:sp, caps:caps, per:per, dur:per*caps.length, start:performance.now(), idx:-1, wasRunning:wasRunning, ended:false };
  var el = document.createElement('div'); el.className = 'demo'; el.id = 'demo';
  el.innerHTML = '<div class="demo-card' + (sp.pattern ? ' calm' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(sp.name) + ' demo" style="' + wvars(sp.c) + '">' +
    '<div class="demo-top"><b>' + esc(sp.name) + '</b><button class="icon-btn" data-act="demo-close" aria-label="Close demo">' + ICON.close + '</button></div>' +
    (sp.pattern ? '<div class="breath"><div class="bring"></div><div class="bcirc"></div><div class="blabel"><span data-bl>Ready</span><small data-bc></small></div></div>' : fig(sp.anim)) +
    '<p class="demo-step" id="dstep"></p><p class="demo-cap" id="dcap" aria-live="polite"></p><div class="demo-bar"><i id="dbar"></i></div>' +
    '<div class="demo-foot"><button class="btn btn-ghost" data-act="demo-replay" id="drep">Replay</button>' + (sp.link ? vid(sp.link, 'Full video') : '') + '</div></div>';
  document.body.appendChild(el);

}
function closeDemo(silent){
  var el = document.getElementById('demo'); if(el) el.remove();
  if(D && D.wasRunning && R && R.timer && R.timer.paused){ R.timer.endAt = Date.now() + R.timer.rem; R.timer.paused = false; updateClock(); }
  if(D && !silent && HAS_TTS){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  D = null;
}
function demoFrame(){
  if(!D) return;
  var root = document.getElementById('demo'); if(!root) { D = null; return; }
  var el = (performance.now() - D.start)/1000, done = el >= D.dur;
  var bar = document.getElementById('dbar'); if(bar) bar.style.width = Math.min(100, el / D.dur * 100) + '%';
  var idx = Math.min(D.caps.length - 1, Math.floor(el / D.per));
  if(idx !== D.idx && !done){
    D.idx = idx;
    var cap = document.getElementById('dcap'), stp = document.getElementById('dstep');
    if(cap) cap.textContent = D.caps[idx];
    if(stp) stp.textContent = 'Step ' + (idx + 1) + ' / ' + D.caps.length;
    say(D.caps[idx]);
  }
  if(D.sp.pattern){ var b = breathState(D.sp.pattern, Math.min(el, D.dur)); paintBreath(root, b); }
  if(done && !D.ended){ D.ended = true; var stp2 = document.getElementById('dstep'); if(stp2) stp2.textContent = 'Demo finished'; }
}

  pick = null; override = false; tab = 'aaj';
  endRun();
  persist().then(function(){ render(); });
  toast('Saved, +' + F.gain + ' XP');
}

function runnerAct(a){
  if(!R) return;
  var st = R.steps[R.i];
  switch(a){
    case 'back': prev(); break;
    case 'close': R.confirm = true; renderRunner(); break;
    case 'confirm-no': R.confirm = false; renderRunner(); break;
    case 'confirm-yes': endRun(); break;
    case 'sound':
      soundMode = (soundMode + 2) % 3; lsSet(SND_KEY, soundMode);
      if(soundMode > 0) audioInit();
      if(soundMode < 2 && HAS_TTS){ try{ window.speechSynthesis.cancel(); }catch(e){} }
      toast(SOUND_NAMES[soundMode] + (soundMode === 2 && !HAS_TTS ? ' (voice does not work on this phone)' : ''));
      renderRunner(); break;
    case 'pause':
      if(!R.timer) break;
      if(R.timer.paused){ R.timer.endAt = Date.now() + R.timer.rem; R.timer.paused = false; }
      else { R.timer.rem = remaining(); R.timer.paused = true; }
      updateClock(); break;
    case 'plus15':
      if(!R.timer) break;
      if(R.timer.paused) R.timer.rem += 15000; else R.timer.endAt += 15000;
      R.timer.total += 15000; R.timer.lb = null; updateClock(); break;
    case 'next': audioInit(); next(); break;
    case 'minus': case 'plus':
      if(st.type !== 'set') break;
      var ex = exById(R.w, st.ex), step = ex.unit === 'sec' ? 5 : 1;
      if(R.sw && R.sw.running){ R.sw.final = swSec(); R.sw.running = false; var sb = document.getElementById('swb'); if(sb) sb.textContent = 'Start hold timer'; }
      R.val = Math.max(0, (R.val || 0) + (a === 'plus' ? step : -step));
      updateVal(); break;
    case 'sw':
      audioInit();
      var b = document.getElementById('swb');
      if(!R.sw || !R.sw.running){ R.sw = { running:true, startAt:Date.now(), final:0, b1:false, b2:false }; if(b) b.textContent = 'Stop'; say('Go'); }
      else { R.sw.final = swSec(); R.sw.running = false; R.val = R.sw.final; updateVal(); if(b) b.textContent = 'Start hold timer'; }
      break;
    case 'set-done':
      if(R.sw && R.sw.running){ R.sw.final = swSec(); R.sw.running = false; R.val = R.sw.final; }
      var exd = exById(R.w, st.ex), before = runXP(), best = R.best[exd.id];
      if(!R.logs[st.ex]) R.logs[st.ex] = [];
      R.logs[st.ex][st.set-1] = R.val;
      var gain = runXP() - before;
      if(best != null && R.val > best && !R.pr[exd.id]){
        R.pr[exd.id] = true;
        flash('New best!', exd.name + ': ' + R.val + ' ' + unitWord(exd));
        confetti(90); beep(880, 0.15); setTimeout(function(){ beep(1175, 0.35); }, 160);
        setTimeout(function(){ say('New best!'); }, 450);
      }
      xpFloat(gain);
      if(R.i < R.steps.length-1) go(R.i+1);
      break;
    case 'save': saveSession(); break;
    case 'discard': endRun(); break;
  }
}

/* ---------- backup (installed app only) ---------- */
function exportData(){
  try{
    var blob = new Blob([JSON.stringify(S, null, 1)], { type:'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'personal-workout-backup-' + isoToday() + '.json';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Backup file saved');
  }catch(e){ toast('Could not make the backup'); }
}
document.addEventListener('change', function(e){
  if(!e.target || e.target.id !== 'impf' || !e.target.files || !e.target.files[0]) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{ var data = normalize(JSON.parse(rd.result)); S = merge(S, data); persist(); render(); toast('Backup restored: ' + data.sessions.length + ' sessions'); }
    catch(err){ toast('This file is not a valid backup'); }
  };
  rd.readAsText(e.target.files[0]);
});

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var a = b.dataset.act;
  if(a === 'demo'){ openDemo(b.dataset.key); return; }
  if(a === 'demo-close'){ closeDemo(); return; }
  if(a === 'demo-replay'){ if(D){ D.start = performance.now(); D.idx = -1; D.ended = false; } return; }
  if(b.closest('#runner')){ runnerAct(a); return; }
  switch(a){
    case 'tab': tab = b.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'start': startRun(b.dataset.w); break;
    case 'resume': resumeRun(); break;
    case 'drop-run': lsDel(RUN_KEY); render(); break;
    case 'override': override = true; render(); break;
    case 'choose': pick = b.dataset.w; override = true; render(); break;
    case 'plan-sel': planSel = b.dataset.w; render(); break;
    case 'waist-save': saveWaist(); break;
    case 'kg-save': saveKg(); break;
    case 'export': exportData(); break;
    case 'walk':
      var m = +b.dataset.m;
      S.sessions.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), t:Date.now(), w:'walk', m:m });
      S = merge(S, { sessions:[], waist:[] });
      render(); persist().then(function(){ render(); });
      toast(m + ' min walk logged, +' + m + ' XP'); break;
  }
});
document.addEventListener('click', function(e){ if(e.target && e.target.id === 'demo') closeDemo(); });
document.addEventListener('toggle', function(){ if(RM) paintFigs(null); }, true);
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && D){ closeDemo(); return; }
  if(e.key === 'Enter' && e.target && e.target.id === 'wcm') saveWaist();
  if(e.key === 'Enter' && e.target && e.target.id === 'wkg') saveKg();
});
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible' && R){ wakeOn(); updateClock(); } });

function saveWaist(){
  var inp = $('#wcm'); var v = parseFloat(inp && inp.value);
  if(!(v >= 50 && v <= 150)){ toast('Enter a number between 50 and 150 cm'); return; }
  var d = isoToday();
  S.waist = S.waist.filter(function(x){ return x.d !== d; });
  S.waist.push({ d:d, cm:Math.round(v*2)/2 });
  S = merge(S, { sessions:[], waist:[] });
  render();
  persist().then(function(){ render(); });
  toast('Waist saved');
}

function saveKg(){
  var inp = $('#wkg'); var v = parseFloat(inp && inp.value);
  if(!(v >= 25 && v <= 250)){ toast('Enter a weight between 25 and 250 kg'); return; }
  S.kg = { v:Math.round(v*10)/10, t:Date.now() };
  render();
  persist().then(function(){ render(); });
  toast('Weight saved');
}

render();
requestAnimationFrame(loop);
initCloud();

})();
